<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="32x32" href="images/nappmenu.png" />
    <link rel="stylesheet" href="app_hub.css" />
    <title>Splash Barbers WEB UI | Main Area Screen</title>
  </head>
  <body> 
    <main class="splashapphub">
        <div class="flex app-layout">
          <nav class="sidebarui" id="sidebar" aria-label="Main navigation">
            <div class="flex margin-bottom_for_app-bar_and_Sidebar_Logo">
                <button class="sidebar-toggle" type="button" aria-label="Collapse navigation menu" aria-controls="sidebar" aria-expanded="true">
                  <img src="images/membersofstaff.png" class="appbarbericon" alt="" />
                </button>
                <img src="images/SplasMainFile.png" class="sidebarlogosplashbar" alt="Splash Barbershop" />
            </div>

            <a class="Sidebar_button flex">
                <img class="button_icon" src="images/membersofstaff.png"/>
                <p class="side-button_text">Staff</p>
            </a>
            <a class="Sidebar_button flex">
                <img class="button_icon" src="images/products.png"/>
                <p class="side-button_text">Products</p>
            </a>
            <a class="Sidebar_button flex">
                <img class="button_icon" src="images/customers.png"/>
                <p class="side-button_text">Clients</p>
            </a>
            <a class="Sidebar_button flex">
                <img class="button_icon" src="images/services.png"/>
                <p class="side-button_text">Services</p>
            </a>
            <a class="Sidebar_button flex">
                <img class="button_icon" src="images/appointments.png"/>
                <p class="side-button_text">Appointments</p>
            </a>
            <a class="Sidebar_button flex">
                <img class="button_icon" src="images/billing.png"/>
                <p class="side-button_text">Billing</p>
            </a>
            <a href="index.html" class="Sidebar_button flex">
                <img class="button_icon" src="images/logout.png"/>
                <p class="side-button_text">Logout</p>
            </a>

          </nav>
          <div class="activity-area_ui">
               <img src="images/SplasMainFile.png" class="mainapplogo" alt="Splash Barbershop" />
               <p class="developeddesignedbys">Developed|designed By Simulakra Technologies LTD</p>
          </div>

        </div>
           
           
    </main>
    <script>
      const sidebar = document.querySelector("#sidebar");
      const sidebarToggle = document.querySelector(".sidebar-toggle");

      const setSidebarState = (isCollapsed) => {
        sidebar.classList.toggle("collapsed", isCollapsed);
        sidebarToggle.setAttribute("aria-expanded", String(!isCollapsed));
        sidebarToggle.setAttribute(
          "aria-label",
          isCollapsed ? "Expand navigation menu" : "Collapse navigation menu"
        );
      };

      const phoneLayout = window.matchMedia("(max-width: 700px)");

      setSidebarState(phoneLayout.matches);

      phoneLayout.addEventListener("change", (event) => {
        setSidebarState(event.matches);
      });

      sidebarToggle.addEventListener("click", () => {
        setSidebarState(!sidebar.classList.contains("collapsed"));
      });
    </script>
  </body>
</html>
